name: Publish offline playground
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m pip_audit -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Build playground with frozen benchmark inputs
        run: |
          python -m scratch.verify_release
          python -m scratch.build
          cp datasets/v4/{cases.json,validity-audit.json,replay.json} dist/
          cp datasets/v4/images/*.png dist/images/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
