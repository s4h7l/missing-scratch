name: Validate benchmark
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m pip_audit -r requirements.txt
      - run: python -m scratch.verify_release
      - run: python -m unittest discover -s tests
      - run: |
          python -m scratch.build
          python -m scratch.build --out /tmp/missing-scratch-replay
          diff -r dist /tmp/missing-scratch-replay
      - run: docker compose config -q
      - run: docker build -t missing-scratch:ci .
      - name: Run V3 backend tests in the built image
        run: docker run --rm -v "$PWD/backend_tests:/checks:ro" missing-scratch:ci python -m unittest discover -s /checks -v
      - name: Scan the final image
        run: |
          docker save missing-scratch:ci -o /tmp/missing-scratch-ci.tar
          docker run --rm -v /tmp/missing-scratch-ci.tar:/scan/image.tar:ro aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image --input /scan/image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1
