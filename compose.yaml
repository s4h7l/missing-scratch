services:
  playground:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - inspection-data:/data
    tmpfs:
      - /tmp
    environment:
      MS_OPERATOR_TOKEN: ${MS_OPERATOR_TOKEN:-}
      MS_JUDGE_CODE: ${MS_JUDGE_CODE:-}
volumes:
  inspection-data:
